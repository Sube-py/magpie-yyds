<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>只因API 用量</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<header>
  <div>
    <h1>只因API 用量</h1>
    <p class="who" id="who"></p>
  </div>
  <div class="seg" role="group" aria-label="时间范围" id="ranges">
    <button type="button" data-days="7">7 天</button>
    <button type="button" data-days="30">30 天</button>
    <button type="button" data-days="90">90 天</button>
  </div>
</header>

<p class="error" id="error" hidden></p>

<section class="tiles" id="tiles"></section>

<section class="card">
  <div class="card-head">
    <h2>余额走势（美元）</h2>
    <span class="note" id="curve-note"></span>
  </div>
  <div class="chart" id="curve"></div>
</section>

<section class="card">
  <div class="card-head"><h2>每日消费（美元）</h2></div>
  <div class="chart" id="daily"></div>
</section>

<section class="card">
  <div class="card-head"><h2>按模型</h2></div>
  <ol class="models" id="models"></ol>
</section>

<section class="card">
  <div class="card-head"><h2>最近请求</h2></div>
  <ol class="records" id="records"></ol>
</section>

<p class="hint">
  数字来自只因API 自己的账本（`/usage`）与余额（`/auth/me`）；余额走势是从今天的余额按之后每一笔消费倒推出来的，
  窗口内的充值不在其中，所以会提示。本页只读，不改任何东西。
</p>
</body>
</html>
